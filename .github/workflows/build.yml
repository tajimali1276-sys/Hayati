name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o Hayati.zip -d proj
      - name: Fix listen
        run: sed -i 's/private fun listen() = h.post {/private fun listen(): Boolean = h.post {/' proj/Hayati/app/src/main/java/com/hayati/assistant/HayatiService.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        working-directory: proj/Hayati
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          grep -E "^e: " build.log | head -20 | while read -r l; do echo "::error::$l"; done
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: Hayati-APK
          path: proj/Hayati/app/build/outputs/apk/debug/app-debug.apk
